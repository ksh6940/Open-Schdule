<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenSchedule Webcam Overlay</title>
  <link rel="stylesheet" href="css/phosphor.css">
  <link rel="stylesheet" href="css/apple-theme.css">
  <link rel="stylesheet" href="css/overlay.css">
</head>
<body>
  <div id="overlay-card">
    <!-- 헤더 -->
    <div class="overlay-header">
      <div class="overlay-header-left">
        <div class="overlay-calendar-badge" id="overlay-calendar-day">14</div>
        <div class="overlay-header-titles">
          <span class="overlay-main-title">오늘의 일정</span>
          <span class="overlay-sub-date" id="overlay-date-text">10월 14일 수요일</span>
        </div>
      </div>

      <div class="overlay-header-right">
        <button class="apple-btn-outline overlay-button" id="btn-open-manager" type="button">
          <span>관리 앱</span> <i class="ph-bold ph-arrow-square-out"></i>
        </button>
      </div>
    </div>

    <div id="overlay-error" class="overlay-error" role="status" aria-live="polite"></div>
    <!-- 체크리스트 목록 -->
    <div class="overlay-scroll-list" id="overlay-list-container">
      <!-- JS 렌더링 -->
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/overlay.js"></script>
</body>
</html>
