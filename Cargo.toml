[workspace]
resolver = "2"
members = ["crates/core", "crates/agent"]

[workspace.package]
version = "1.0.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/ksh6940/Open-Schdule"

[workspace.dependencies]
openschedule-core = { path = "crates/core" }

anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
directories = "5"
log = "0.4"
env_logger = "0.11"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.31"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_System_Power",
] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
